<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - Employee Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">EMS</div>
      <nav id="sidebar-nav"></nav>
      <button type="button" id="logout-button" class="logout">Log out</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <span id="username"></span>
        <span id="roles" class="roles"></span>
      </header>
      <main class="content">
        <div id="message" class="message" hidden></div>
        <h1>Employees</h1>
        <p class="subtitle">Search and manage the records visible to your role.</p>

        <div class="toolbar employee-directory-toolbar">
          <input id="search" type="search" placeholder="Search by name, email, or employee code" aria-label="Search employees">
          <select id="department-filter" aria-label="Filter by department">
            <option value="">All departments</option>
          </select>
          <select id="status-filter" aria-label="Filter by employment status">
            <option value="">All statuses</option>
          </select>
          <a id="add-link" class="button primary" href="/pages/employee-form.html">Add employee</a>
        </div>

        <div class="table-wrap directory-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Employee ID</th>
                <th>Department</th>
                <th>Email &amp; phone</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employee-rows"></tbody>
          </table>
        </div>
        <p id="empty" class="empty" hidden>No employees found.</p>
        <div class="directory-pagination" aria-label="Employee directory pagination">
          <span id="directory-results" class="directory-results"></span>
          <div class="directory-page-controls">
            <button id="previous-page" class="button" type="button" disabled>Previous</button>
            <span id="page-info" aria-live="polite"></span>
            <button id="next-page" class="button" type="button" disabled>Next</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/employees.js"></script>
</body>
</html>
