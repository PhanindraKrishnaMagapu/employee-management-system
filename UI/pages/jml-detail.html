<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JML Event Detail - Employee Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">EMS</div>
      <nav id="sidebar-nav"></nav>
      <button type="button" id="logout-button" class="logout">Log out</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <span id="username"></span>
        <span id="roles" class="roles"></span>
      </header>
      <main class="content">
        <div id="message" class="message" hidden></div>
        <h1>JML Event Detail</h1>
        <p class="subtitle">Event status, checklist progress, and Mover history.</p>

        <section class="panel">
          <h2>Summary</h2>
          <div id="event-summary" class="jml-summary"></div>
          <div id="manage-controls" class="status-control" hidden>
            <label>
              Event status
              <select id="event-status">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </label>
            <button type="button" id="update-status">Update status</button>
          </div>
        </section>

        <section class="panel">
          <h2>Checklist</h2>
          <ul id="checklist" class="checklist"></ul>
        </section>

        <section id="history-panel" class="panel" hidden>
          <h2>Employee history</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Effective date</th>
                  <th>Department</th>
                  <th>Designation</th>
                  <th>Manager</th>
                  <th>Location</th>
                  <th>Reason</th>
                </tr>
              </thead>
              <tbody id="history-rows"></tbody>
            </table>
          </div>
        </section>

        <p><a class="button" href="/pages/jml.html">Back to JML events</a></p>
      </main>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/jml-detail.js"></script>
</body>
</html>
