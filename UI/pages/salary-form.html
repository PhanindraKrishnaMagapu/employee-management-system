<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary Form - Employee Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">EMS</div>
      <nav id="sidebar-nav"></nav>
      <button type="button" id="logout-button" class="logout">Log out</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <span id="username"></span>
        <span id="roles" class="roles"></span>
      </header>
      <main class="content">
        <div id="message" class="message" hidden></div>
        <h1 id="page-title">Add Salary</h1>
        <p id="page-subtitle" class="subtitle">Confidential salary details can be managed only by HR Admin.</p>

        <form id="salary-form" class="salary-form">
          <div class="form-grid">
            <label id="employee-select-field">
              Employee *
              <select id="employee" name="employee_id" required>
                <option value="">Select an employee</option>
              </select>
            </label>
            <div id="employee-readonly" class="employee-readonly" hidden>
              <span class="label">Employee</span>
              <strong id="employee-summary">-</strong>
            </div>
            <label>
              Annual CTC *
              <input id="annual-salary" name="annual_salary" type="number" min="0" step="0.01" required>
            </label>
            <label>
              Monthly gross salary
              <input id="monthly-gross-salary" name="monthly_gross_salary" type="number" min="0" step="0.01">
            </label>
            <label>
              Monthly basic salary
              <input id="monthly-basic-salary" name="monthly_basic_salary" type="number" min="0" step="0.01">
            </label>
            <label>
              Monthly HRA
              <input id="monthly-hra" name="monthly_hra" type="number" min="0" step="0.01">
            </label>
            <label>
              Monthly allowances
              <input id="monthly-allowances" name="monthly_allowances" type="number" min="0" step="0.01">
            </label>
            <label>
              Monthly deductions
              <input id="monthly-deductions" name="monthly_deductions" type="number" min="0" step="0.01">
            </label>
            <label>
              Currency *
              <input id="currency" name="currency" type="text" maxlength="3" value="INR" required>
            </label>
            <label>
              Effective from *
              <input id="effective-from" name="effective_from" type="date" required>
            </label>
            <label>
              Effective to
              <input id="effective-to" name="effective_to" type="date">
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-button">Add salary</button>
            <a class="button" href="/pages/salaries.html">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/salary-form.js"></script>
</body>
</html>
