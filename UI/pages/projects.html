<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Employee Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">EMS</div>
      <nav id="sidebar-nav"></nav>
      <button type="button" id="logout-button" class="logout">Log out</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <span id="username"></span>
        <span id="roles" class="roles"></span>
      </header>
      <main class="content">
        <div id="message" class="message" hidden></div>
        <h1>Projects</h1>
        <p class="subtitle">Projects and assignment counts visible to your role.</p>

        <div class="toolbar">
          <input id="search" type="search" placeholder="Search projects" aria-label="Search projects">
          <a id="create-link" class="button primary" href="/pages/project-form.html">Create project</a>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Status</th>
                <th>Start date</th>
                <th>End date</th>
                <th>Assignments</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="project-rows"></tbody>
          </table>
        </div>
        <p id="empty" class="empty" hidden>No projects found.</p>
      </main>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/projects.js"></script>
</body>
</html>
