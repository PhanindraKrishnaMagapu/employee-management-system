<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee form - Employee Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">EMS</div>
      <nav id="sidebar-nav"></nav>
      <button type="button" id="logout-button" class="logout">Log out</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <span id="username"></span>
        <span id="roles" class="roles"></span>
      </header>
      <main class="content">
        <div id="message" class="message" hidden></div>
        <h1 id="form-title">Employee</h1>
        <p id="form-subtitle" class="subtitle"></p>
        <form id="employee-form">
          <div id="fields" class="form-grid"></div>
          <div class="form-actions">
            <button type="submit" id="submit-button">Save employee</button>
            <a class="button" href="/pages/employees.html">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/employee-form.js"></script>
</body>
</html>
